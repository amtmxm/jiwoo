<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>운행일지</title>
<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --ink: #17211d;
    --muted: #6b7873;
    --line: #dde3e0;
    --accent: #0f6b4f;
    --accent-soft: #e0f0e9;
    --sun: #c8402f;
    --sat: #2b5fb5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121815;
      --surface: #1b2420;
      --ink: #eaf1ee;
      --muted: #8b9a94;
      --line: #2b3732;
      --accent: #4fc79d;
      --accent-soft: #1d3a2f;
      --sun: #ef7d6e;
      --sat: #7ba6ee;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Noto Sans KR", "Roboto", sans-serif;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 28px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    user-select: none;
  }

  header { padding: 8px 16px 14px; }
  .nav { display: flex; align-items: center; justify-content: space-between; }
  .nav button {
    width: 48px; height: 48px; border: 0; border-radius: 50%;
    background: var(--surface); color: var(--ink); font-size: 22px;
  }
  .nav button:active { background: var(--accent-soft); }
  .month { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .total { text-align: center; margin-top: 10px; color: var(--muted); font-size: 14px; }
  .total b { color: var(--accent); font-size: 22px; margin-left: 6px; font-variant-numeric: tabular-nums; }

  .week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px; }
  .week div { text-align: center; font-size: 13px; padding: 6px 0; color: var(--muted); }
  .week div:first-child { color: var(--sun); }
  .week div:last-child { color: var(--sat); }

  .grid { flex: 1; gap: 4px; grid-auto-rows: 1fr; padding-bottom: 8px; }
  .cell {
    background: var(--surface);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    font: inherit; color: var(--ink);
    min-height: 0;
  }
  .cell.empty { background: transparent; pointer-events: none; }
  .cell .d { font-size: 15px; font-weight: 600; }
  .cell.sun .d { color: var(--sun); }
  .cell.sat .d { color: var(--sat); }
  .cell .a {
    font-size: 11px; font-weight: 600; color: var(--accent);
    font-variant-numeric: tabular-nums; min-height: 14px;
  }
  .cell.has { background: var(--accent-soft); }
  .cell.today { border-color: var(--accent); }
  .cell:active { transform: scale(0.96); }

  /* 입력 시트 */
  .scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateY(105%); transition: transform .25s ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; }
  .sheet label { font-size: 13px; color: var(--muted); }
  .sheet input {
    width: 100%; margin: 6px 0 16px; padding: 14px;
    font-size: 26px; font-weight: 700; text-align: right;
    border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--bg); color: var(--ink); user-select: text;
  }
  .sheet input:focus { outline: none; border-color: var(--accent); }
  .btns { display: flex; gap: 10px; }
  .btns button {
    flex: 1; padding: 15px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 14px; background: var(--bg); color: var(--ink);
  }
  .btns .save { flex: 2; background: var(--accent); color: #fff; }
  .btns .del { color: var(--sun); }

  /* 백업 */
  .backup-btn {
    margin: 0 16px 4px; padding: 12px; border: 0; border-radius: 12px;
    background: transparent; color: var(--muted); font: inherit; font-size: 14px;
  }
  .backup-btn:active { background: var(--accent-soft); }
  .sheet textarea {
    width: 100%; height: 120px; margin: 6px 0 12px; padding: 12px;
    font-size: 13px; font-family: monospace; resize: none;
    border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--bg); color: var(--ink); user-select: text;
  }
  .sheet textarea:focus { outline: none; border-color: var(--accent); }
  .sheet .hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .btns.stack { flex-direction: column; }
  .btns .restore { background: var(--bg); }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
    background: var(--ink); color: var(--bg); padding: 14px 16px; border-radius: 14px;
    font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="nav">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="month" id="month"></div>
    <button id="next" aria-label="다음 달">›</button>
  </div>
  <div class="total">이번 달 입금 합계<b id="total">0</b></div>
</header>

<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
<div class="grid" id="grid"></div>

<button class="backup-btn" id="backupBtn">백업 / 복원</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle"></h2>
  <label for="amount">입금액 (원)</label>
  <input id="amount" type="text" inputmode="numeric" placeholder="0" autocomplete="off">
  <div class="btns">
    <button class="del" id="del">삭제</button>
    <button id="cancel">취소</button>
    <button class="save" id="save">저장</button>
  </div>
</div>

<div class="sheet" id="bkSheet">
  <h2>백업 / 복원</h2>
  <p class="hint" id="lastBk"></p>
  <textarea id="bkText" placeholder="복원할 때는 백업한 내용을 여기에 붙여넣으세요" spellcheck="false"></textarea>
  <div class="btns stack">
    <button class="save" id="bkCopy">백업 복사하기</button>
    <button class="restore" id="bkRestore">붙여넣은 내용으로 복원하기</button>
    <button id="bkClose">닫기</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const KEY = 'unhaeng.deposits.v1';
  const DOW = ['일','월','화','수','목','금','토'];
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }

  const now = new Date();
  let year = now.getFullYear();
  let month = now.getMonth(); // 0-11
  let selected = null;

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString('ko-KR');
  const pad = n => String(n).padStart(2, '0');
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const save = () => localStorage.setItem(KEY, JSON.stringify(data));

  function render() {
    $('month').textContent = `${year}년 ${month + 1}월`;
    const first = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    const grid = $('grid');
    grid.innerHTML = '';
    let sum = 0;

    for (let i = 0; i < first; i++) {
      const e = document.createElement('div');
      e.className = 'cell empty';
      grid.appendChild(e);
    }
    for (let d = 1; d <= days; d++) {
      const k = keyOf(year, month, d);
      const v = data[k];
      const dow = (first + d - 1) % 7;
      const b = document.createElement('button');
      b.className = 'cell' + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '')
        + (v ? ' has' : '')
        + (year === now.getFullYear() && month === now.getMonth() && d === now.getDate() ? ' today' : '');
      b.innerHTML = `<span class="d">${d}</span><span class="a">${v ? fmt(v) : ''}</span>`;
      b.onclick = () => openSheet(d);
      grid.appendChild(b);
      if (v) sum += v;
    }
    $('total').textContent = fmt(sum);
  }

  function openSheet(d) {
    selected = d;
    const k = keyOf(year, month, d);
    const dow = DOW[new Date(year, month, d).getDay()];
    $('sheetTitle').textContent = `${month + 1}월 ${d}일 (${dow})`;
    $('amount').value = data[k] ? fmt(data[k]) : '';
    $('scrim').classList.add('open');
    $('sheet').classList.add('open');
    setTimeout(() => $('amount').focus(), 250);
  }
  function closeSheet() {
    $('scrim').classList.remove('open');
    $('sheet').classList.remove('open');
    $('bkSheet').classList.remove('open');
    if (document.activeElement) document.activeElement.blur();
  }

  $('amount').addEventListener('input', e => {
    const n = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = n ? fmt(n) : '';
  });
  $('save').onclick = () => {
    const n = parseInt($('amount').value.replace(/[^0-9]/g, ''), 10);
    const k = keyOf(year, month, selected);
    if (n) data[k] = n; else delete data[k];
    save(); closeSheet(); render();
  };
  $('del').onclick = () => {
    delete data[keyOf(year, month, selected)];
    save(); closeSheet(); render();
  };
  $('cancel').onclick = closeSheet;
  $('scrim').onclick = closeSheet;

  $('prev').onclick = () => { month--; if (month < 0) { month = 11; year--; } render(); };
  $('next').onclick = () => { month++; if (month > 11) { month = 0; year++; } render(); };

  /* ---- 백업 / 복원 ---- */
  const LAST_KEY = 'unhaeng.lastBackup';
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  function showLast() {
    const l = localStorage.getItem(LAST_KEY);
    const n = Object.keys(data).length;
    $('lastBk').textContent = (l ? `마지막 백업: ${l}` : '아직 백업한 적이 없어요')
      + ` · 저장된 기록 ${n}일`;
  }
  $('backupBtn').onclick = () => {
    $('bkText').value = '';
    showLast();
    $('scrim').classList.add('open');
    $('bkSheet').classList.add('open');
  };
  $('bkClose').onclick = closeSheet;

  $('bkCopy').onclick = async () => {
    const payload = JSON.stringify({
      app: 'unhaeng', version: 1,
      exported: new Date().toISOString(),
      deposits: data
    });
    $('bkText').value = payload;
    let ok = false;
    try { await navigator.clipboard.writeText(payload); ok = true; }
    catch (e) {
      try { $('bkText').select(); ok = document.execCommand('copy'); } catch (e2) {}
    }
    if (ok) {
      const d = new Date();
      localStorage.setItem(LAST_KEY, `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`);
      showLast();
      toast('복사했어요. 카톡 "나와의 채팅"이나 메모 앱에 붙여넣어 보관하세요');
    } else {
      toast('자동 복사에 실패했어요. 글상자를 길게 눌러 직접 복사하세요');
    }
  };

  $('bkRestore').onclick = () => {
    const raw = $('bkText').value.trim();
    if (!raw) return toast('붙여넣은 백업 내용이 없어요');
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { return toast('백업 형식이 올바르지 않아요'); }
    const src = obj && obj.deposits;
    if (!src || typeof src !== 'object') return toast('백업 형식이 올바르지 않아요');
    const clean = {};
    for (const [k, v] of Object.entries(src)) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number.isFinite(v) && v > 0) clean[k] = Math.round(v);
    }
    const n = Object.keys(clean).length;
    if (!n) return toast('복원할 기록이 없어요');
    if (!confirm(`${n}일치 기록으로 복원할까요?\n현재 저장된 기록은 덮어써져요.`)) return;
    data = clean;
    save(); render(); closeSheet();
    toast(`${n}일치 기록을 복원했어요`);
  };

  render();
</script>
</body>
</html>
