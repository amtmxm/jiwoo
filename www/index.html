<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>운행일지</title>
<style>
  body { margin: 0; background: #f3f5f4; color: #6b7873; font-family: sans-serif; padding: 80px 20px; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #121815; color: #8b9a94; } }
</style>
</head>
<body>
<script>
  // 로더: 앱 화면(app.html)을 불러와 실행합니다. 업데이트를 받았으면 그 버전을 실행합니다.
  (async function () {
    const OTA = 'unhaeng.ota', PENDING = 'unhaeng.pending';
    const verOf = h => { const m = /name="app-version"\s+content="(\d+)"/.exec(h); return m ? +m[1] : 0; };
    let html = '', own = 0;
    try {
      html = await (await fetch('app.html', { cache: 'no-store' })).text();
      own = verOf(html);
    } catch (e) {}
    try {
      const saved = JSON.parse(localStorage.getItem(OTA) || 'null');
      if (localStorage.getItem(PENDING)) {
        // 직전에 받은 업데이트가 정상 실행되지 못함 → 기본 버전으로 복구
        if (saved) localStorage.setItem('unhaeng.bad', String(saved.v));
        localStorage.removeItem(OTA);
        localStorage.removeItem(PENDING);
      } else if (saved && saved.v > own && saved.html) {
        html = saved.html;
        localStorage.setItem(PENDING, '1');
      } else if (saved) {
        localStorage.removeItem(OTA);
      }
    } catch (e) {}
    if (!html) { document.body.textContent = '앱을 불러오지 못했어요'; return; }
    document.open();
    document.write(html);
    document.close();
  })();
</script>
</body>
</html>
